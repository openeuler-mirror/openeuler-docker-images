name: deathstarbench
category: cloud
description: DeathStarBench 是一个开源的云微服务基准测试套件，提供酒店预订、社交网络等多个端到端微服务应用，用于评估微服务框架、云操作系统及硬件系统的性能。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  deathstarbench镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.4.1-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/Cloud/deathstarbench/0.4.1/24.03-lts-sp4/Dockerfile) | DeathStarBench 0.4.1 on openEuler 24.03-LTS-SP4 | amd64, arm64 |
  |[0.4.1-oe2403sp3](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/Cloud/deathstarbench/0.4.1/24.03-lts-sp3/Dockerfile) | DeathStarBench 0.4.1 on openEuler 24.03-LTS-SP3 | amd64, arm64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/deathstarbench:{Tag}
  ```

usage: |
  - 启动 deathstarbench 容器（交互式 shell）

    ```
    docker run -it --name deathstarbench openeuler/deathstarbench:{Tag} bash
    ```
    `openeuler/deathstarbench`镜像构建了hotelReservation微服务基准测试套件，并安装了所有服务二进制文件（frontend、geo、profile、rate、recommendation、reservation、search、user等）。


  - 快速验证（启动 frontend）

    创建最小配置文件 `config.json`：
    ```json
    {
      "consulAddress": "127.0.0.1:8500",
      "jaegerAddress": "127.0.0.1:6831",
      "FrontendPort": "5000"
    }
    ```
    启动 frontend 并检查 HTTP 状态：
    ```bash
    docker run -d --name dsb-frontend -v "$PWD/config.json:/app/config.json" -p 5000:5000 openeuler/deathstarbench:{Tag}
    curl -s -o /dev/null -w '%{http_code}\n' http://localhost:5000/
    ```
    预期返回 `200`。完整 hotelReservation 基准还需要启动 consul、jaeger、mongodb、memcached 以及各微服务。

