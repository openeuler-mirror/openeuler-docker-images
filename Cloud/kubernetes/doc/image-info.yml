download: |
  拉取镜像到本地
  ```
  docker pull openeuler/kubernetes:{Tag}
  ```

usage: |
  - 查看 kubeadm 版本

    ```
    docker run --rm openeuler/kubernetes:{Tag} ./_output/bin/kubeadm version
    ```
    该镜像内置 kubeadm，默认执行 `kubeadm --help` 后退出，用于验证上游 Kubernetes 版本与 openEuler 的集成。
  

license: Apache-2.0 license
similar_packages:
  - Docker Swarm: Docker 官方提供的轻量级容器编排工具。
dependency:
  - rsync
  - golang

homepage: https://github.com/kubernetes/kubernetes
upstream:
  backend: GitHub
  version_url: kubernetes/kubernetes
  version_prefix: v
  version_filter: rc;alpha;beta;candidate
  version_scheme: RPM