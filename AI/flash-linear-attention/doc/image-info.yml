name: flash-linear-attention
category: ai
description: Flash Linear Attention（FLA）提供线性注意力算子的高效Triton实现（Gated DeltaNet、GLA等）与配套的线性注意力语言模型。本镜像基于torch_npu与Triton-Ascend，线性注意力层可在昇腾NPU上完成前向与反向计算。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  Flash Linear Attention镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.6.0-torch_npu2.10.0-cann9.2.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/flash-linear-attention/0.6.0-torch_npu2.10.0-cann9.2.0-python3.12/24.03-lts-sp4/Dockerfile)| Flash Linear Attention 0.6.0 (torch_npu 2.10.0.post7, CANN 9.2.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/flash-linear-attention:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-flash-linear-attention \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/flash-linear-attention:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-flash-linear-attention` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/flash-linear-attention:{Tag}` | 指定要运行的镜像`openeuler/flash-linear-attention`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认FLA识别到Triton-Ascend后端：
    ```bash
    docker exec -it my-flash-linear-attention /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import fla; from fla.utils import IS_NPU, device_platform; print('fla', fla.__version__); print('IS_NPU', IS_NPU); print('device_platform', device_platform)"
    ```

    在NPU上跑一次GatedDeltaNet前向与反向（覆盖线性层、Causal Conv1D、Gated Delta Rule与门控RMSNorm）：
    ```python
    import torch
    import torch_npu

    from fla.layers import GatedDeltaNet
    from fla.utils import IS_NPU, device_platform

    assert IS_NPU
    assert device_platform == "npu"
    torch.manual_seed(42)

    layer = GatedDeltaNet(
        hidden_size=512,
        head_dim=64,
        num_heads=6,
        expand_v=2,
        mode="chunk",
    ).to(device="npu", dtype=torch.bfloat16).train()

    x = torch.randn(
        1,
        128,
        512,
        device="npu",
        dtype=torch.bfloat16,
        requires_grad=True,
    )
    y = layer(x)[0]
    loss = y.float().square().mean()
    loss.backward()
    torch.npu.synchronize()

    print("device", y.device.type)
    print("output_shape", tuple(y.shape))
    print("forward_finite", torch.isfinite(y).all().item())
    print("backward_finite", torch.isfinite(x.grad).all().item())
    ```

