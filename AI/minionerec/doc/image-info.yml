similar_packages:
  - RecBole: RecBole是统一的推荐系统库，覆盖传统推荐与序列推荐的大量模型。
  - EasyRec: EasyRec是阿里开源的推荐算法框架，提供端到端的训练与部署流程。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - trl
  - datasets
  - modelscope

