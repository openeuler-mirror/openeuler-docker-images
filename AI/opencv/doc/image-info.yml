similar_packages:
  - libvips: libvips是高性能的图像处理库，内存占用低，适合大批量图像的流水线处理。
  - Pillow: Pillow是Python生态常用的图像处理库，覆盖常见图像格式读写与基础处理操作。
dependency:
  - python3
  - numpy
  - CANN
  - opencv_contrib

homepage: https://github.com/opencv/opencv
upstream:
  backend: GitHub
  version_url: opencv/opencv
  version_prefix: ""
  version_filter: alpha;rc;candidate
  version_scheme: RPM
