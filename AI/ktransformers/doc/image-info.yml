name: ktransformers
category: ai
description: KTransformers是面向大模型异构推理与微调优化的开源框架，主打CPU与加速器协同的大MoE模型推理。本镜像基于torch_npu与CANN准备昇腾运行环境，内置上游昇腾教程所用的框架源码与全部Python依赖。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  KTransformers镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.7.2-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/ktransformers/0.7.2-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| KTransformers 0.7.2 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/ktransformers:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-ktransformers \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/ktransformers:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-ktransformers` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/ktransformers:{Tag}` | 指定要运行的镜像`openeuler/ktransformers`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证torch/torch_npu环境，再按上游昇腾教程在NPU机器上完成框架构建并启动服务：
    ```bash
    docker exec -it my-ktransformers /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    source /usr/local/Ascend/ascend-toolkit/set_env.sh
    cd /opt/ktransformers/archive
    USE_BALANCE_SERVE=1 USE_NUMA=1 bash ./install.sh
    ```

    构建完成后，按上游教程准备合并权重（DeepSeek-R1/V3或Qwen3-MoE，权重从ModelScope下载），并启动balance_serve服务：
    ```bash
    source /usr/local/Ascend/ascend-toolkit/set_env.sh
    source /usr/local/Ascend/nnal/atb/set_env.sh
    python ktransformers/server/main.py \
        --port 10002 \
        --model_path <your model path> \
        --gguf_path <your model path> \
        --model_name DeepSeekV3ForCausalLM \
        --cpu_infer 100 \
        --optimize_config_path ./ktransformers/optimize/optimize_rules/npu/DeepSeek-V3-Chat-300IA2-npu-serve.yaml \
        --max_new_tokens 1024 \
        --cache_lens 20480 \
        --max_batch_size 4 \
        --use_cuda_graph \
        --tp 1 \
        --backend_type balance_serve
    ```

    国内网络可通过ModelScope或hf-mirror加速模型下载：
    ```bash
    export HF_ENDPOINT=https://hf-mirror.com
    ```

license: Apache-2.0 license
similar_packages:
  - vllm-ascend: vllm-ascend是vLLM的昇腾NPU适配版本，提供高吞吐的大模型推理服务。
  - llama.cpp: llama.cpp是面向GGUF格式大模型的轻量级C/C++推理引擎，支持CPU与加速器异构推理。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - accelerate
  - CANN toolkit

homepage: https://github.com/kvcache-ai/ktransformers
upstream:
  backend: GitHub
  version_url: kvcache-ai/ktransformers
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
