similar_packages:
  - GPTQModel: GPTQModel是开源的大模型后训练量化工具，支持GPTQ等多种算法，主要面向GPU场景。
  - LLM Compressor: LLM Compressor是vLLM项目的大模型压缩工具库，支持多种量化算法，压缩模型可直接由vLLM部署。
dependency:
  - python3
  - torch
  - torch_npu
  - numpy

homepage: https://github.com/bitsandbytes-foundation/bitsandbytes
