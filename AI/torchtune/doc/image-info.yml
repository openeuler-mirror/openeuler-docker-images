name: torchtune
category: ai
description: Torchtune是Meta开源的PyTorch原生大模型微调库，提供LoRA、QLoRA、知识蒸馏等开箱即用且易于修改的训练recipe。本镜像基于torch_npu，可在昇腾NPU上通过`device=npu`对大模型进行LoRA微调。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  Torchtune镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.6.1-torch_npu2.11.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/torchtune/0.6.1-torch_npu2.11.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| Torchtune 0.6.1 (torch_npu 2.11.0.post2, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/torchtune:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-torchtune \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/torchtune:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-torchtune` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/torchtune:{Tag}` | 指定要运行的镜像`openeuler/torchtune`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认torchtune版本与`tune` CLI：
    ```bash
    docker exec -it my-torchtune /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import torchtune; print('torchtune', torchtune.__version__)"
    tune --help
    ```

    之后可从ModelScope下载`Qwen/Qwen2.5-0.5B-Instruct`底座，准备alpaca格式的`data.json`，运行单卡LoRA微调：
    ```bash
    ASCEND_RT_VISIBLE_DEVICES=0 tune run lora_finetune_single_device \
      --config qwen2_5/0.5B_lora_single_device \
      device=npu \
      checkpointer.checkpoint_dir="<model_path>" \
      tokenizer.path="<model_path>/vocab.json" \
      tokenizer.merges_file="<model_path>/merges.txt" \
      dataset=torchtune.datasets.alpaca_dataset \
      dataset.source=json \
      dataset.data_files="${PWD}/data.json" \
      metric_logger=torchtune.training.metric_logging.StdoutLogger \
      ~metric_logger.log_dir \
      log_peak_memory_stats=False \
      output_dir="${PWD}/output" \
      max_steps_per_epoch=3 \
      epochs=1 \
      log_every_n_steps=1
    ```
    完整流程参考[Ascend快速上手文档](https://github.com/cosdt-ci-test/workflows/blob/main/projects/torchtune/docs/Quick-start-Ascend.md)。

license: BSD-3-Clause license
similar_packages:
  - ms-swift: ModelScope官方的大模型微调与部署框架，支持300多个模型。
  - LLaMA-Factory: 开源的统一大模型微调框架，支持LLM与VLM的多种微调算法。
dependency:
  - python3
  - torch
  - torch_npu
  - torchdata
  - torchao
  - datasets
  - omegaconf
  - modelscope
  - tiktoken
  - sentencepiece

homepage: https://github.com/meta-pytorch/torchtune
upstream:
  backend: GitHub
  version_url: meta-pytorch/torchtune
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
