name: specforge
category: ai
description: SpecForge是SGLang项目开源的投机解码训练框架，支持从类型化运行配置训练draft模型、导出运行时检查点与对SGLang服务做基准测试。本镜像基于torch_npu并内置mooncake NPU传输引擎，可在昇腾NPU上完成投机解码的在线训练。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  SpecForge镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[b520d2b-torch_npu2.10.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/specforge/b520d2b-torch_npu2.10.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| SpecForge b520d2b (torch_npu 2.10.0.post6, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/specforge:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-specforge \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -v /root/.cache:/root/.cache \
        -it openeuler/specforge:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-specforge` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/specforge:{Tag}` | 指定要运行的镜像`openeuler/specforge`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先加载CANN环境，确认specforge可导入且NPU栈可用：
    ```bash
    docker exec -it my-specforge /bin/bash
    source /usr/local/Ascend/ascend-toolkit/set_env.sh
    python3 -c "import specforge, torch, torch_npu; print('specforge', getattr(specforge, '__version__', 'unknown')); print('torch.npu.is_available', torch.npu.is_available())"
    specforge --help
    ```
    CLI提供`train`/`export`/`benchmark`三个子命令。

    完整的在线训练按上游Quick Start执行：先起`mooncake_master`，再起打好spec-capture补丁的SGLang capture server（dflash方法，卡0），然后用`specforge train -c examples/configs/online/disaggregated/external/qwen3.5-4b-dflash-online-npu.yaml ...`跑最小1步训练（卡1训练，卡2/3预留给HCCL通信buffer）。模型（如`Qwen/Qwen3.5-4B`）从ModelScope下载；启动前需用SpecForge仓的`scripts/apply_sglang_spec_capture_patch.sh`给SGLang server打补丁。注意：在线训练需要另行准备带CANN的SGLang server镜像（Quick Start使用sglang 0.5.18）。

license: MIT license
similar_packages:
  - EAGLE: EAGLE是高吞吐的自回归投机解码draft训练框架，与vLLM等推理引擎集成。
  - Medusa: Medusa通过多头draft输出并行预测多个token实现投机解码加速。
dependency:
  - python3
  - torch
  - torch_npu
  - accelerate
  - click
  - mooncake-transfer-engine-npu
  - modelscope

homepage: https://github.com/sgl-project/SpecForge
upstream:
  backend: GitHub
  version_url: sgl-project/SpecForge
  version_prefix: ""
  version_filter: alpha;rc;candidate
  version_scheme: RPM
