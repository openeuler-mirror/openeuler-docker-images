name: opencompass
category: ai
description: OpenCompass是开源的大模型评测框架，提供模型、数据集与汇总器的统一抽象和丰富的基准配置。本镜像基于torch_npu，原生Hugging Face封装可在昇腾NPU上直接加载模型并完成评测。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  OpenCompass镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.5.5-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/opencompass/0.5.5-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| OpenCompass 0.5.5 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/opencompass:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-opencompass \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -v /root/.cache:/root/.cache \
        -it openeuler/opencompass:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-opencompass` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/opencompass:{Tag}` | 指定要运行的镜像`openeuler/opencompass`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先加载CANN环境，确认OpenCompass版本与NPU可用：
    ```bash
    docker exec -it my-opencompass /bin/bash
    source /usr/local/Ascend/ascend-toolkit/set_env.sh
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import opencompass; print('opencompass', opencompass.__version__)"
    ```

    从ModelScope下载Qwen2-0.5B-Instruct（首次约1 GB，之后走本地缓存）：
    ```bash
    python3 -c "from modelscope import snapshot_download; print(snapshot_download('Qwen/Qwen2-0.5B-Instruct'))"
    ```

    在工作目录写入`npu_chat.py`与`eval_qwen2_gsm8k.py`后，在NPU上评测GSM8K demo数据集（64条）：
    ```python
    # npu_chat.py
    from opencompass.models.huggingface_above_v4_33 import HuggingFacewithChatTemplate
    from opencompass.registry import MODELS


    @MODELS.register_module()
    class HuggingFaceNPUChat(HuggingFacewithChatTemplate):
        def generate(self, inputs, max_out_len, **kwargs):
            print('\nopencompass_model_device', next(self.model.parameters()).device, flush=True)
            return super().generate(inputs, max_out_len, **kwargs)
    ```
    ```python
    # eval_qwen2_gsm8k.py（将<MODEL_PATH>替换为上面打印的模型路径）
    from mmengine.config import read_base
    from npu_chat import HuggingFaceNPUChat

    with read_base():
        from opencompass.configs.datasets.demo.demo_gsm8k_chat_gen import gsm8k_datasets

    gsm8k_datasets[0]['infer_cfg']['inferencer']['max_out_len'] = 32

    datasets = gsm8k_datasets
    models = [
        dict(
            type=HuggingFaceNPUChat,
            abbr='qwen2-0.5b-instruct',
            path=r'<MODEL_PATH>',
            max_out_len=32,
            batch_size=4,
            model_kwargs=dict(torch_dtype='bfloat16'),
            run_cfg=dict(num_gpus=1),
        )
    ]
    ```
    ```bash
    export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
    export DATASET_SOURCE=ModelScope
    opencompass eval_qwen2_gsm8k.py --debug -w outputs/oc_npu_qs 2>&1
    cat outputs/oc_npu_qs/*/summary/summary_*.txt
    ```
    日志必须包含`opencompass_model_device npu:0`（模型已加载到NPU），summary中输出`demo_gsm8k`的accuracy。

