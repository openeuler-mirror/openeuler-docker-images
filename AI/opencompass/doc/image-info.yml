similar_packages:
  - lm-evaluation-harness: EleutherAI开源的大模型评测框架，覆盖大量学术基准与自定义任务。
  - EvalScope: ModelScope团队推出的轻量级大模型评测框架，支持多种推理后端与可视化看板。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - mmengine
  - datasets
  - modelscope

