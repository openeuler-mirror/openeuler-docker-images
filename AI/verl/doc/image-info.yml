name: verl
category: ai
description: verl（Volcano Engine Reinforcement Learning for LLM）是火山引擎开源的分布式RLHF/RL后训练框架，支持SFT、PPO/GRPO与agentic RL流水线，训练后端（FSDP2、Megatron）与推理引擎（vLLM、SGLang）可插拔。本镜像基于torch_npu并内置vLLM-Ascend推理栈与Megatron/MindSpeed训练栈，可在昇腾NPU上直接运行后训练。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  verl镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.10.0.dev-torch_npu2.10.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/verl/0.10.0.dev-torch_npu2.10.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| verl 0.10.0.dev (vLLM-Ascend 0.30.0, torch_npu 2.10.0.post7, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/verl:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-verl \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/verl:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-verl` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/verl:{Tag}` | 指定要运行的镜像`openeuler/verl`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先source CANN环境并验证NPU与vLLM-Ascend推理栈：
    ```bash
    docker exec -it my-verl /bin/bash
    source /usr/local/Ascend/ascend-toolkit/set_env.sh && \
    source /usr/local/Ascend/nnal/atb/set_env.sh
    python3 -c "import torch, torch_npu, vllm, vllm_ascend, verl; print('is_available:', torch.npu.is_available())"
    ```

    然后按照[Ascend快速开始指南](https://github.com/verl-project/verl/blob/main/docs/ascend_tutorial/en/get_start/quick_start.rst)运行GSM8K GRPO训练（Qwen3-0.6B）：
    ```bash
    # 1. 准备Qwen3-0.6B权重（从Hugging Face或ModelScope下载），放到~/models/Qwen/Qwen3-0.6B
    # 2. 预处理GSM8K数据集
    cd /verl
    python3 examples/data_preprocess/gsm8k.py --local_dataset_path /download/path/hf_data/gsm8k/
    # 3. 运行vLLM + FSDP2快速开始脚本
    bash tests/special_npu/quick_start/run_qwen3_0_6b_fsdp2_vllm_ascend.sh
    ```
    脚本会初始化actor、rollout与reference worker，经vLLM-Ascend生成回复并完成第一个GRPO训练step。其余训练/推理后端组合（vLLM + Megatron、SGLang + FSDP2、SGLang + Megatron）的脚本同样位于`tests/special_npu/quick_start/`，注意本镜像为vLLM版本，未安装SGLang。

license: Apache-2.0 license
similar_packages:
  - ROLL: ROLL是阿里巴巴开源的大规模强化学习训练框架，基于Hydra配置驱动，支持FSDP2/Megatron训练策略与vLLM推理引擎。
  - AReaL: AReaL是开源的大规模异步强化学习系统，面向LLM与agentic RL后训练场景。
dependency:
  - python3
  - torch
  - torch_npu
  - vllm
  - vllm-ascend
  - megatron
  - mindspeed
  - transformers
  - ray
  - triton-ascend

homepage: https://github.com/verl-project/verl
upstream:
  backend: GitHub
  version_url: verl-project/verl
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
