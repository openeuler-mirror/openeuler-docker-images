name: wenet
category: ai
description: WeNet是面向工业级落地的开源端到端语音识别工具包，以统一框架支持流式与非流式识别，并提供训练、解码与多语言部署全栈。本镜像基于torch_npu，通过官方run_npu.sh脚本可在昇腾NPU上完成模型训练与推理。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  WeNet镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[3.1.0-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/wenet/3.1.0-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| WeNet 3.1.0 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/wenet:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-wenet \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/wenet:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-wenet` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/wenet:{Tag}` | 指定要运行的镜像`openeuler/wenet`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认WeNet安装可用：
    ```bash
    docker exec -it my-wenet /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import importlib.metadata as m; print('wenet', m.version('wenet'))"
    ```

    在NPU上按官方aishell-1流程训练语音识别模型（数据集经ModelScope下载，run_npu.sh自动选择NPU设备，详细步骤见[昇腾Quick Start看护文档](https://github.com/cosdt-ci-test/workflows/blob/main/projects/wenet/docs/Quick-start-Ascend.md)）：
    ```bash
    cd /wenet/examples/aishell/s0
    bash run_npu.sh --stage -1 --stop_stage 3 --data /root/asr-data/OpenSLR/33
    bash run_npu.sh --stage 4 --stop_stage 4 --train_config conf/train_conformer.yaml --data /root/asr-data/OpenSLR/33
    ls exp/conformer/epoch_0.pt
    ```

license: Apache-2.0 license
similar_packages:
  - FunASR: ModelScope开源的语音识别工具包，提供Paraformer、语音端点检测、标点恢复与说话人分离等能力。
  - ESPnet: 开源的端到端语音处理工具包，覆盖语音识别、语音合成与语音翻译等任务。
dependency:
  - python3
  - torch
  - torch_npu
  - torchaudio
  - deepspeed
  - sox
  - openai-whisper

homepage: https://github.com/wenet-e2e/wenet
upstream:
  backend: GitHub
  version_url: wenet-e2e/wenet
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
