name: evalscope
category: ai
description: EvalScope是ModelScope团队推出的轻量级大模型评测框架，统一封装LLM/VLM/RAG/AIGC等多类评测后端并提供可视化看板。本镜像基于torch_npu，Native后端（transformers + accelerate）可在昇腾NPU上直接加载模型并完成评测。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  EvalScope镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[1.14.1-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/evalscope/1.14.1-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| EvalScope 1.14.1 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/evalscope:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-evalscope \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -v /root/.cache:/root/.cache \
        -it openeuler/evalscope:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-evalscope` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/evalscope:{Tag}` | 指定要运行的镜像`openeuler/evalscope`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先加载CANN环境，确认EvalScope版本与NPU可用：
    ```bash
    docker exec -it my-evalscope /bin/bash
    source /usr/local/Ascend/ascend-toolkit/set_env.sh
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import evalscope; print('evalscope', evalscope.__version__)"
    ```

    从ModelScope下载Qwen2.5-0.5B-Instruct（首次约1 GB，之后走本地缓存）：
    ```bash
    python3 -c "from modelscope import snapshot_download; print(snapshot_download('Qwen/Qwen2.5-0.5B-Instruct'))"
    ```

    用Native后端在NPU上评测`gsm8k`与`arc`两个数据集各5条样本（`--limit 5`仅用于快速验证流程，不代表真实榜单值）：
    ```bash
    evalscope eval \
      --model <MODEL_PATH> \
      --datasets gsm8k arc \
      --limit 5 \
      --no-timestamp \
      --model-args '{"device_map": "npu"}' \
      --work-dir outputs/evalscope_npu_qs
    ```
    评测报告以JSON写入`outputs/evalscope_npu_qs/reports/<模型名>/`目录，所有`score`应落在[0,1]区间。可用`ASCEND_RT_VISIBLE_DEVICES`指定卡号（例如`0`表示仅用第0张卡）。

license: Apache-2.0 license
similar_packages:
  - lm-evaluation-harness: EleutherAI开源的大模型评测框架，覆盖大量学术基准与自定义任务。
  - OpenCompass: OpenCompass是开源的大模型评测框架，提供模型、数据集与汇总器的统一抽象。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - accelerate
  - modelscope
  - numpy

homepage: https://github.com/modelscope/evalscope
upstream:
  backend: GitHub
  version_url: modelscope/evalscope
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
