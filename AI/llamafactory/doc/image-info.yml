similar_packages:
  - ms-swift: ms-swift是魔乐社区开源的大模型训练推理框架，支持300+模型的微调与部署。
  - axolotl: axolotl是开源的大模型微调工具，基于配置文件驱动多种训练算法。
  - xtuner: xtuner是上海AI实验室开源的多模态大模型微调框架。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - deepspeed
  - triton-ascend
  - gradio

