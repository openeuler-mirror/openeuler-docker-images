name: opencode
category: ai
description: opencode 是开源的 AI 编程助手，提供代码补全、对话等能力，支持多种 LLM 后端，可在终端中运行。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  opencode镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[1.1.48-oe2403sp4](https://gitee.com/openeuler/openeuler-docker-images/blob/master/AI/opencode/1.1.48/24.03-lts-sp4/Dockerfile)| opencode 1.1.48 on openEuler 24.03-lts-sp4 | amd64, arm64 |
  |[1.1.48-oe2403lts](https://gitee.com/openeuler/openeuler-docker-images/blob/master/AI/opencode/1.1.48/24.03-lts/Dockerfile)| opencode 1.1.48 on openEuler 24.03-lts | amd64, arm64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/opencode:{Tag}
  ```

usage: |
  本镜像提供 opencode 命令行工具，用于在终端中进行 AI 辅助编程。

  - 启动 opencode 交互式终端：
    ```
    docker run -it --name opencode \
        -v ~/.config/opencode:/root/.config/opencode \
        openeuler/opencode:{Tag}
    ```

  - 查看帮助：
    ```
    docker run --rm openeuler/opencode:{Tag} opencode --help
    ```

license: MIT
similar_packages:
  - github-copilot-cli: GitHub Copilot 提供的命令行 AI 助手
  - cursor: 基于 AI 的代码编辑器，支持多种 LLM
  - aider: 开源的命令行 AI 编程助手，支持多模型
  - continue: 开源的 AI 编程插件，支持多种编辑器

dependency:
  -

homepage: https://github.com/anomalyco/opencode
upstream:
  backend: GitHub
  version_url: anomalyco/opencode
  version_prefix: v
  version_filter: rc;alpha;beta
  version_scheme: RPM
