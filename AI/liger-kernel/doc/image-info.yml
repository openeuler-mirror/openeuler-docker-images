name: liger-kernel
category: ai
description: Liger Kernel是LinkedIn开源的大模型训练算子优化库，提供Triton融合算子（RMSNorm、SwiGLU、融合线性交叉熵等），一行代码即可将优化算子应用到Transformer模型，提升训练吞吐并降低显存占用。本镜像集成triton-ascend后端与torch_npu，可在昇腾NPU上直接应用Liger优化算子。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  Liger Kernel镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.8.5-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/liger-kernel/0.8.5-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| Liger Kernel 0.8.5 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/liger-kernel:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-liger-kernel \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/liger-kernel:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-liger-kernel` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/liger-kernel:{Tag}` | 指定要运行的镜像`openeuler/liger-kernel`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境与昇腾Triton后端，再确认Liger Kernel版本：
    ```bash
    docker exec -it my-liger-kernel /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import triton; import triton.backends.ascend; print('triton', triton.__version__)"
    python3 -c "from importlib.metadata import version; print('liger-kernel', version('liger-kernel'))"
    ```

    直接组合Liger算子模块，在NPU上完成若干步参数更新（输入张量位于NPU时，算子经Liger的Ascend后端执行）：
    ```python
    import torch
    import torch_npu
    from liger_kernel.transformers import LigerRMSNorm, LigerFusedLinearCrossEntropyLoss

    hidden_size = 128
    vocab_size = 256
    norm = LigerRMSNorm(hidden_size).npu()
    loss_fn = LigerFusedLinearCrossEntropyLoss()
    x = torch.randn(4, 16, hidden_size, dtype=torch.bfloat16, device='npu', requires_grad=True)
    target = torch.randint(vocab_size, (4, 16), device='npu')
    weight = torch.randn(vocab_size, hidden_size, dtype=torch.bfloat16, device='npu', requires_grad=True)
    optimizer = torch.optim.SGD([weight, *norm.parameters()], lr=0.01)

    for _ in range(3):
        optimizer.zero_grad()
        x.grad = None
        hidden = norm(x)
        loss = loss_fn(weight, hidden.reshape(-1, hidden_size), target.reshape(-1))
        assert torch.isfinite(loss).item()
        loss.backward()
        optimizer.step()

    print('device:', x.device.type)
    print('loss:', f'{loss.item():.4f}')
    ```

    对完整模型可用`AutoLigerKernelForCausalLM`在加载时自动应用优化算子：
    ```python
    import torch
    import torch_npu
    from liger_kernel.transformers import AutoLigerKernelForCausalLM

    model = AutoLigerKernelForCausalLM.from_pretrained(
        "Qwen/Qwen3-0.6B", dtype=torch.bfloat16,
    ).to('npu').train()
    ```

    国内网络可通过ModelScope或hf-mirror加速模型下载：
    ```bash
    export HF_ENDPOINT=https://hf-mirror.com
    ```

