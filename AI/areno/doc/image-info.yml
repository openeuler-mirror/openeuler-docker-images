name: areno
category: ai
description: AReno是inclusionAI开源的单节点RL后训练工具包，支持RLVR与agentic RL，v0.9.0起自带昇腾NPU后端（安装时编译Ascend C加速扩展）。本镜像基于torch_npu，可在昇腾NPU上直接进行RL训练与OpenAI兼容推理服务。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  AReno镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.10.0-torch_npu2.10.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/areno/0.10.0-torch_npu2.10.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| AReno 0.10.0 (torch_npu 2.10.0.post6, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/areno:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-areno \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/areno:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-areno` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/areno:{Tag}` | 指定要运行的镜像`openeuler/areno`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境与NPU加速扩展，再确认CLI入口：
    ```bash
    docker exec -it my-areno /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import importlib.util as u; specs = {m: u.find_spec(m) for m in ['areno', 'areno.accel', 'areno.accel._areno_accel_npu']}; [print(m, 'ok' if s is not None else 'MISSING') for m, s in specs.items()]"
    areno train --help && areno serve --help
    ```

    运行GSM8K上的GSPO最小RLVR训练（模型`Qwen/Qwen3-0.6B`，训练1步、生成256 token）：
    ```bash
    cd /opt/AReno
    source /usr/local/Ascend/ascend-toolkit/set_env.sh
    export HF_ENDPOINT=https://hf-mirror.com
    ASCEND_RT_VISIBLE_DEVICES=0 areno train \
      --ckpt Qwen/Qwen3-0.6B \
      --dataset-path openai/gsm8k:main \
      --model-hub hf \
      --dataset-loader-fn examples/math/dataset_loader.py \
      --reward-fn-path examples/math/math_verify_reward.py \
      --algo gspo \
      --backend npu \
      --attn-backend native \
      --tp-size 1 \
      --world-size 1 \
      --batch-size 1 \
      --max-steps 1 \
      --max-new-tokens 256 \
      --save-path outputs/qwen3-gspo \
      --save-interval 1
    ```

    日志中的`stage=rollout_end`、`metric=reward_mean`、`stage=save_checkpoint_end`与`stage=max_steps_reached`及`outputs/qwen3-gspo/step_000001`目录表示训练链路在NPU上成功完成。随后可用`areno serve --model-path outputs/qwen3-gspo/step_000001 --backend npu --attn-backend native --tp-size 1 --world-size 1 --port 8000`启动OpenAI兼容推理服务。

license: Apache-2.0 license
similar_packages:
  - unsloth: unsloth是面向单卡微调优化的开源训练框架，以更低的显存占用加速LoRA/QLoRA训练。
  - TRL: TRL是Hugging Face开源的Transformer强化学习库，提供SFT、DPO、PPO等后训练算法。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - datasets
  - math-verify
  - modelscope

homepage: https://github.com/inclusionAI/AReno
upstream:
  backend: GitHub
  version_url: inclusionAI/AReno
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
