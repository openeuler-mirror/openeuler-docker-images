similar_packages:
  - stable-diffusion-webui: AUTOMATIC1111开源的Stable Diffusion浏览器Web界面，支持文生图、图生图及丰富的插件生态。
  - InvokeAI: 开源的Stable Diffusion创意套件，提供画布式交互界面与专业工作流。
