name: comfyui
category: ai
description: ComfyUI是开源的节点式扩散模型图形界面，通过可视化工作流编排文生图、图生图与视频生成流水线，并提供HTTP API。本镜像基于torch_npu，ComfyUI可自动检测昇腾NPU并选用npu设备，在昇腾上直接运行扩散模型。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  ComfyUI镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.44.0-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/comfyui/0.44.0-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| ComfyUI 0.44.0 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/comfyui:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-comfyui \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -v /root/.cache:/root/.cache \
        -p 8188:8188 \
        -d openeuler/comfyui:{Tag}
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。容器启动后浏览器访问`http://<宿主机IP>:8188`即可使用交互式Web界面。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-comfyui` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-v /root/.cache:/root/.cache` | 将宿主机缓存目录`/root/.cache`挂载到容器中，用于复用ModelScope等模型缓存，请根据实际情况修改。|
    | `-p 8188:8188` | 将容器内ComfyUI服务端口8188映射到宿主机。|
    | `-d` | 以后台模式启动容器，ComfyUI服务由镜像默认命令拉起。|
    | `openeuler/comfyui:{Tag}` | 指定要运行的镜像`openeuler/comfyui`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认ComfyUI可用：
    ```bash
    docker exec -it my-comfyui /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import comfy.model_management as mm; print('comfy device:', mm.get_torch_device())"
    ```

    用ModelScope下载SD 1.5权重，通过API例程完成一次文生图：
    ```bash
    python3 -c "from modelscope import snapshot_download; print(snapshot_download('AI-ModelScope/stable-diffusion-v1-5', revision='master', allow_patterns=['v1-5-pruned-emaonly.safetensors']))"
    ln -sf /root/.cache/modelscope/hub/models/AI-ModelScope/stable-diffusion-v1-5/v1-5-pruned-emaonly.safetensors models/checkpoints/
    python3 script_examples/basic_api_example.py
    ls output/ComfyUI_*.png
    ```

