name: lm-evaluation-harness
category: ai
description: LM Evaluation Harness（lm-eval）是EleutherAI开源的统一大模型评测框架，内置数百个标准评测任务，支持HuggingFace、vLLM等多种模型后端。本镜像基于torch_npu，可在昇腾NPU上直接运行大模型评测。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  LM Evaluation Harness镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.4.13-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/lm-evaluation-harness/0.4.13-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| LM Evaluation Harness 0.4.13 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/lm-evaluation-harness:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-lm-evaluation-harness \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/lm-evaluation-harness:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-lm-evaluation-harness` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/lm-evaluation-harness:{Tag}` | 指定要运行的镜像`openeuler/lm-evaluation-harness`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认lm_eval版本：
    ```bash
    docker exec -it my-lm-evaluation-harness /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import lm_eval; print('lm_eval', lm_eval.__version__)"
    ```

    用`Qwen/Qwen2.5-0.5B-Instruct`在`npu:0`上跑官方`arc_easy`任务（`--limit 10`仅评测10条样本，用于验证流程）：
    ```bash
    lm_eval run --model hf \
        --model_args pretrained=Qwen/Qwen2.5-0.5B-Instruct \
        --device npu:0 \
        --batch_size 8 \
        --limit 10 \
        --tasks arc_easy \
        --output_path output/lm_eval_out
    ```

    国内网络可通过ModelScope或hf-mirror加速模型与数据集下载：
    ```bash
    export HF_ENDPOINT=https://hf-mirror.com
    ```

license: MIT license
similar_packages:
  - OpenCompass: OpenCompass是上海AI实验室开源的大模型评测平台，提供全链路评测能力。
  - EvalScope: EvalScope是魔搭社区开源的大模型评估框架，支持多种评测维度与后端。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - datasets
  - accelerate
  - peft

homepage: https://github.com/EleutherAI/lm-evaluation-harness
upstream:
  backend: GitHub
  version_url: EleutherAI/lm-evaluation-harness
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
