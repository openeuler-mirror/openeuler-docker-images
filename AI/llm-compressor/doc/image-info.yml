name: llm-compressor
category: ai
description: LLM Compressor是vLLM项目开源的大模型压缩工具库，支持RTN、GPTQ、AWQ、AutoRound等量化算法，压缩后的模型可直接由vLLM部署。本镜像基于torch_npu，可在昇腾NPU上完成模型量化与压缩模型的前向推理。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  LLM Compressor镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.15.0-torch_npu2.10.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/llm-compressor/0.15.0-torch_npu2.10.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| LLM Compressor 0.15.0 (torch_npu 2.10.0.post6, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/llm-compressor:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-llm-compressor \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/llm-compressor:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-llm-compressor` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/llm-compressor:{Tag}` | 指定要运行的镜像`openeuler/llm-compressor`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认llmcompressor版本：
    ```bash
    docker exec -it my-llm-compressor /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import llmcompressor; print('llmcompressor', llmcompressor.__version__)"
    ```

    对公开小模型`nm-testing/tinysmokeqwen3`（约10 MB，无需Hugging Face token）做一次W4A16 RTN量化，保存后重载并前向：
    ```python
    from pathlib import Path

    import torch
    import torch_npu
    from compressed_tensors.quantization import QuantizationArgs, QuantizationScheme
    from transformers import AutoModelForCausalLM, AutoTokenizer

    from llmcompressor import oneshot
    from llmcompressor.modifiers.quantization import QuantizationModifier

    model_id = "nm-testing/tinysmokeqwen3"
    device = "npu:0"
    compressed_dir = Path.home() / "llm-compressor-work" / "compressed"

    model = AutoModelForCausalLM.from_pretrained(model_id, dtype=torch.float16).to(device)
    tokenizer = AutoTokenizer.from_pretrained(model_id)
    recipe = QuantizationModifier(
        ignore=["lm_head"],
        config_groups={
            "group_0": QuantizationScheme(
                targets=["Linear"],
                weights=QuantizationArgs(num_bits=4, strategy="group", group_size=32),
            )
        },
    )
    torch.accelerator.max_memory_allocated = lambda device=None: 0
    torch.accelerator.get_memory_info = lambda device=None: (0, 1)
    oneshot(model=model, recipe=recipe, output_dir=str(compressed_dir))

    reloaded = AutoModelForCausalLM.from_pretrained(compressed_dir, dtype=torch.float16).to(device)
    inputs = tokenizer("hello", return_tensors="pt").to(device)
    logits = reloaded(**inputs).logits
    print("logits.device", logits.device)
    ```

    国内网络可通过ModelScope或hf-mirror加速模型下载：
    ```bash
    export HF_ENDPOINT=https://hf-mirror.com
    ```

license: Apache-2.0 license
similar_packages:
  - GPTQModel: GPTQModel是开源的大模型后训练量化工具，支持GPTQ等多种算法，主要面向GPU场景。
  - AutoAWQ: AutoAWQ是AWQ量化算法的官方实现，用于对大模型进行权重量化以加速推理。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - accelerate
  - compressed-tensors
  - datasets
  - auto-round

homepage: https://github.com/vllm-project/llm-compressor
upstream:
  backend: GitHub
  version_url: vllm-project/llm-compressor
  version_prefix:
  version_filter: alpha;rc;candidate
  version_scheme: RPM
