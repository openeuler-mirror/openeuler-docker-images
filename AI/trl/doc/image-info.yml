  - ms-swift: ModelScope开源的大模型微调框架，支持SFT/LoRA/DPO等训练与多模态模型微调。
  - LLaMA-Factory: 一站式大模型微调框架，内置SFT/LoRA/DPO等常用训练流程与WebUI。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - accelerate
  - datasets
  - peft
  - huggingface-hub

homepage: https://github.com/huggingface/trl
upstream:
  backend: GitHub
  version_url: huggingface/trl
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
