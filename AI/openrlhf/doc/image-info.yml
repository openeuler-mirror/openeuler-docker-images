name: openrlhf
category: ai
description: OpenRLHF是基于DeepSpeed、Accelerate和Transformers的易用、可扩展、高性能RLHF框架，提供SFT、奖励建模、PPO/DPO等后训练流程。本镜像基于torch_npu并预置torch.cuda到NPU的映射，可在昇腾NPU上直接完成RLHF训练。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  OpenRLHF镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.11.2-torch_npu2.11.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/openrlhf/0.11.2-torch_npu2.11.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| OpenRLHF 0.11.2 (torch_npu 2.11.0.post2, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/openrlhf:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-openrlhf \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/openrlhf:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-openrlhf` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/openrlhf:{Tag}` | 指定要运行的镜像`openeuler/openrlhf`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境与torch.cuda到NPU的映射，再确认OpenRLHF源码树已就位：
    ```bash
    docker exec -it my-openrlhf /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import torch; print(torch.zeros(1, device='cuda').device)"
    python3 -c "import openrlhf; print(openrlhf.__file__)"
    ```

    运行`Qwen/Qwen2.5-0.5B-Instruct`的4样本LoRA SFT（经ModelScope下载，无需Hugging Face token）：
    ```bash
    mkdir -p /root/openrlhf-qs
    ln -s "$(python3 -c 'from modelscope import snapshot_download; print(snapshot_download("Qwen/Qwen2.5-0.5B-Instruct"))' | grep '^/' | tail -n 1)" /root/openrlhf-qs/model
    ```

    将4行`{"question": ..., "response": ...}`数据保存为`/root/openrlhf-qs/tiny_sft.jsonl`后执行（昇腾上使用`--ds.attn_implementation eager`与`--ds.adam_offload`，不启用`--ds.packing_samples`）：
    ```bash
    deepspeed --module openrlhf.cli.train_sft \
      --data.max_len 256 \
      --data.dataset /root/openrlhf-qs/tiny_sft.jsonl \
      --data.input_key question \
      --data.output_key response \
      --train.batch_size 1 \
      --train.micro_batch_size 1 \
      --data.max_samples 4 \
      --model.model_name_or_path /root/openrlhf-qs/model \
      --ckpt.output_dir /root/openrlhf-qs/ckpt \
      --ckpt.save_steps -1 \
      --logger.logging_steps 1 \
      --eval.steps -1 \
      --ds.zero_stage 2 \
      --ds.adam_offload \
      --train.max_epochs 1 \
      --ds.param_dtype bf16 \
      --ds.attn_implementation eager \
      --adam.lr 5e-6 \
      --ds.lora.rank 8 \
      --model.gradient_checkpointing_enable \
      --data.dataloader_num_workers 0
    ```

    训练日志中`device='npu'`与`Train step of epoch 0: 100%`表示训练在NPU上成功完成。

license: Apache-2.0 license
similar_packages:
  - TRL: TRL是Hugging Face开源的Transformer强化学习库，提供SFT、DPO、PPO等后训练算法。
  - verl: verl是字节跳动开源的分布式RLHF训练框架，基于Ray与Megatron实现大规模后训练。
dependency:
  - python3
  - torch
  - torch_npu
  - deepspeed
  - transformers
  - accelerate
  - peft
  - datasets

homepage: https://github.com/OpenRLHF/OpenRLHF
upstream:
  backend: GitHub
  version_url: OpenRLHF/OpenRLHF
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
