name: onnx
category: ai
description: ONNX（Open Neural Network Exchange）是开放神经网络交换格式，提供 AI 模型互操作性，支持在不同框架间转换和运行模型。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  onnx镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[1.18.0-oe2403sp4](https://gitee.com/openeuler/openeuler-docker-images/blob/master/AI/onnx/1.18.0/24.03-lts-sp4/Dockerfile)| onnx 1.18.0 on openEuler 24.03-lts-sp4 | amd64, arm64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/onnx:{Tag}
  ```

usage: |
  - 启动容器
    ```
    docker run -it openeuler/onnx:{Tag} bash
    ```

license: Apache-2.0
similar_packages:
  -

dependency:
  -

homepage: https://github.com/onnx/onnx
upstream:
  backend: GitHub
  version_url: onnx/onnx
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
  