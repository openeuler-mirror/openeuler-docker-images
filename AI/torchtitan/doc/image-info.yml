name: torchtitan
category: ai
description: Torchtitan是PyTorch官方开源的大规模分布式训练框架（概念验证架构），支持FSDP、张量并行、流水线并行与异步分布式训练。本镜像基于torch_npu与triton-ascend，可在昇腾NPU上进行大模型并行训练。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  Torchtitan镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.4.0-torch_npu2.14.0-cann9.2.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/torchtitan/0.4.0-torch_npu2.14.0-cann9.2.0-python3.12/24.03-lts-sp4/Dockerfile)| Torchtitan 0.4.0 (torch_npu 2.14.0, CANN 9.2.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/torchtitan:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-torchtitan \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/torchtitan:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-torchtitan` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/torchtitan:{Tag}` | 指定要运行的镜像`openeuler/torchtitan`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认torchtitan与triton-ascend版本：
    ```bash
    docker exec -it my-torchtitan /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import torchtitan; print('torchtitan', torchtitan.__version__)"
    python3 -c "from importlib.metadata import version; print('triton-ascend', version('triton-ascend'))"
    ```

    之后按[Ascend快速上手文档](https://github.com/cosdt-ci-test/workflows/blob/main/projects/torchtitan/docs/Quick-start-Ascend.md)下载NPU override模块，通过`--override.imports`机制运行上游默认的`llama3_debugmodel`训练（单卡2步）：
    ```bash
    PYTHONPATH="$HOME/tt-npu-overrides" \
    ASCEND_RT_VISIBLE_DEVICES=0 \
    TORCHINDUCTOR_COMPILE_THREADS=1 \
    torchrun --nproc_per_node=1 \
        --rdzv_backend c10d \
        --rdzv_endpoint="localhost:0" \
        -m torchtitan.train \
        --module llama3 \
        --config llama3_debugmodel \
        --override.imports npu_compat.npu_attention \
        --comm.mode default \
        --training.steps 2 \
        --training.local-batch-size 1 \
        --training.seq-len 256 \
        --metrics.log-freq 1 \
        --metrics.disable-color-printing \
        --dump-folder /tmp/torchtitan-quickstart
    ```

