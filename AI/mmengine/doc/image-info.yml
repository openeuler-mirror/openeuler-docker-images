name: mmengine
category: ai
description: MMEngine是OpenMMLab的训练引擎基础库，提供Runner训练循环、配置系统、注册器与Hook机制，支撑MMDetection等上层算法库。MMEngine原生支持昇腾NPU（设备抽象、混合精度、NPU融合优化器），本镜像基于torch_npu可直接在NPU上训练模型。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  MMEngine镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.10.7-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/mmengine/0.10.7-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| MMEngine 0.10.7 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/mmengine:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-mmengine \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/mmengine:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-mmengine` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/mmengine:{Tag}` | 指定要运行的镜像`openeuler/mmengine`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认MMEngine识别到NPU设备：
    ```bash
    docker exec -it my-mmengine /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import mmengine, mmengine.runner, mmengine.hooks, mmengine.visualization; print('mmengine subpackages ok')"
    ```

    确认`mmengine.device`选择`npu`设备且`autocast`混合精度上下文可用：
    ```python
    import torch
    import torch_npu

    from mmengine.device import get_device, is_npu_available
    from mmengine.runner import amp

    print('get_device:', get_device())
    print('is_npu_available:', is_npu_available())
    print('npu_count:', torch.npu.device_count())

    linear = torch.nn.Linear(8, 2).to('npu')
    with amp.autocast(device_type='npu', dtype=torch.float16):
        x = torch.randn(4, 8, device='npu')
        y = linear(x)
    print('autocast_dtype:', y.dtype)
    print('autocast_device:', y.device)
    ```

    `Runner`通过同样的机制把模型放到NPU上（`model.to(get_device())`），训练配置里无需填写任何设备字段。

license: Apache-2.0 license
similar_packages:
  - PyTorch Lightning: PyTorch Lightning是流行的轻量级PyTorch训练框架，提供高阶训练循环封装。
  - MMCV: MMCV是OpenMMLab的计算机视觉基础库，与MMEngine配套提供算子与视觉工具。
dependency:
  - python3
  - torch
  - torch_npu
  - numpy
  - matplotlib
  - opencv-python-headless
  - rich

homepage: https://github.com/open-mmlab/mmengine
upstream:
  backend: GitHub
  version_url: open-mmlab/mmengine
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
