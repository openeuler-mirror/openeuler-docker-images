similar_packages:
  - KServe: KServe是云原生的模型推理与服务编排框架，支持自动扩缩容与多种推理运行时。
  - KubeAI: KubeAI是Kubernetes上的模型推理平台，提供模型目录化部署与弹性伸缩。
dependency:
  - python3
  - torch
  - torch_npu
  - vllm
  - vllm-ascend
  - triton-ascend
  - modelscope

homepage: https://github.com/vllm-project/aibrix
upstream:
  backend: GitHub
  version_url: vllm-project/aibrix
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
