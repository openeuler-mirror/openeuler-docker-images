similar_packages:
  - vLLM: vLLM是高吞吐量大模型推理与服务引擎，提供OpenAI兼容API与PagedAttention显存优化。
  - SGLang: SGLang是面向大模型的高性能推理与服务框架，提供结构化生成与RadixAttention前缀缓存。
dependency:
  - python3
  - torch
  - torch_npu
  - fschat
  - transformers
  - accelerate
  - modelscope

homepage: https://github.com/lm-sys/FastChat
upstream:
  backend: GitHub
  version_url: lm-sys/FastChat
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
