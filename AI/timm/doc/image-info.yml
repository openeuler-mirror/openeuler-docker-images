name: timm
category: ai
description: timm（pytorch-image-models）是Hugging Face维护的PyTorch图像模型库，收录数百个预训练视觉模型（ResNet、ViT、EfficientNet等），支持分类推理、多尺度特征提取与微调训练。本镜像集成torch_npu与CANN，可在昇腾NPU上直接运行视觉模型推理与训练。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  timm镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[1.0.31-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/timm/1.0.31-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| timm 1.0.31 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/timm:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-timm \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/timm:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-timm` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/timm:{Tag}` | 指定要运行的镜像`openeuler/timm`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认timm版本：
    ```bash
    docker exec -it my-timm /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import timm; print('timm', timm.__version__)"
    ```

    在NPU上用`timm.create_model('resnet18')`跑一次前向推理：
    ```python
    import timm
    import torch
    import torch_npu

    model = timm.create_model("resnet18").to("npu:0").eval()
    x = torch.randn(1, 3, 224, 224, device="npu:0")
    with torch.no_grad():
        out = model(x)
    print("out_shape", tuple(out.shape))
    ```

    加载预训练权重做真实分类推理（优先从ModelScope拉取`timm/resnet18.a1_in1k`的`model.safetensors`，失败时回退HF镜像并`pretrained=True`自动下载）：
    ```python
    import os

    import safetensors.torch
    import timm
    import torch
    import torch_npu

    try:
        from modelscope.hub.snapshot_download import snapshot_download

        model_dir = snapshot_download("timm/resnet18.a1_in1k")
        model = timm.create_model("resnet18")
        model.load_state_dict(
            safetensors.torch.load_file(os.path.join(model_dir, "model.safetensors"))
        )
    except Exception:
        os.environ.setdefault("HF_ENDPOINT", "https://hf-mirror.com")
        model = timm.create_model("resnet18", pretrained=True)

    model = model.to("npu:0").eval()
    x = torch.randn(1, 3, 224, 224, device="npu:0")
    with torch.no_grad():
        out = model(x)
    print("out_shape", tuple(out.shape))
    ```

