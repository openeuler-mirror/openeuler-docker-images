similar_packages:
  - torchvision.models: PyTorch官方视觉模型库，提供常用分类、分割、检测模型与预训练权重。
  - Kornia: 可微分计算机视觉库，把经典视觉算子实现为PyTorch模块，便于训练与GPU/NPU加速。
dependency:
  - python3
  - torch
  - torch_npu
  - torchvision
  - huggingface-hub
  - safetensors

homepage: https://github.com/huggingface/pytorch-image-models
upstream:
  backend: GitHub
  version_url: huggingface/pytorch-image-models
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
