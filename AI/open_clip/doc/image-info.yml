similar_packages:
  - OpenAI CLIP: OpenAI发布的图文对比预训练模型原始实现，是open_clip的上游参考。
  - Chinese-CLIP: 面向中文场景的图文对比学习实现，提供中文预训练权重与零样本能力。
dependency:
  - python3
  - torch
  - torch_npu
  - torchvision
  - timm
  - huggingface-hub
  - safetensors
  - transformers

