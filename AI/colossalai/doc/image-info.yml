name: colossalai
category: ai
description: ColossalAI是HPC-AI Tech开源的大规模分布式深度学习训练框架，提供Booster混合并行、张量/流水线并行与显存优化等能力。本镜像基于torch_npu，可在昇腾NPU上使用Booster与TorchDDP插件进行大模型训练。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  ColossalAI镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.5.0-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/colossalai/0.5.0-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| ColossalAI 0.5.0 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/colossalai:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-colossalai \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/colossalai:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-colossalai` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/colossalai:{Tag}` | 指定要运行的镜像`openeuler/colossalai`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认ColossalAI版本与NPU加速器识别：
    ```bash
    docker exec -it my-colossalai /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import torch, torch_npu, colossalai; from colossalai.accelerator import get_accelerator; acc = get_accelerator(); print('colossalai', colossalai.__version__); print('accel_name', acc.name); print('accel_device', acc.get_current_device())"
    ```

    输出`accel_name npu`、`accel_device npu:0`即代表ColossalAI已识别昇腾NPU。之后可用`launch` + `Booster(plugin=TorchDDPPlugin())`对Qwen2.5-0.5B做一步训练，完整流程参考[Ascend快速上手文档](https://github.com/cosdt-ci-test/workflows/blob/main/projects/colossalai/docs/Quick-start-Ascend.md)。

license: Apache-2.0 license
similar_packages:
  - DeepSpeed: 微软开源的深度学习优化库，以ZeRO显存优化与大规模分布式训练见长。
  - Accelerate: Hugging Face开源的轻量级分布式训练封装库，简化多卡多机训练代码。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - peft
  - galore_torch
  - bitsandbytes
  - einops
  - modelscope

homepage: https://github.com/hpcaitech/ColossalAI
upstream:
  backend: GitHub
  version_url: hpcaitech/ColossalAI
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
