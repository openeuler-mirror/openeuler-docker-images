similar_packages:
  - xDiT: xDiT是统一的扩散模型并行推理框架，提供张量并行、序列并行与PipeFusion流水线并行。
  - Diffusers: Diffusers是Hugging Face开源的扩散模型库，提供主流文生图、文生视频模型的单卡推理实现。
dependency:
  - python3
  - torch
  - torch_npu
  - cache-dit
  - diffusers
  - transformers
  - accelerate
  - einops

homepage: https://github.com/vipshop/cache-dit
upstream:
  backend: GitHub
  version_url: vipshop/cache-dit
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
