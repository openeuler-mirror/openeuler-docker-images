name: cache-dit
category: ai
description: Cache-DiT是面向Diffusion Transformer的推理缓存加速库，通过缓存复用中间特征跳过冗余计算，并支持上下文并行与张量并行。本镜像基于torch_npu，内置昇腾原生注意后端（_native_npu/_npu_fia），可在昇腾NPU上加速FLUX、Qwen-Image等模型的生成。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  Cache-DiT镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[1.5.3-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/cache-dit/1.5.3-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| Cache-DiT 1.5.3 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/cache-dit:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-cache-dit \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/cache-dit:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-cache-dit` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/cache-dit:{Tag}` | 指定要运行的镜像`openeuler/cache-dit`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认cache-dit可导入：
    ```bash
    docker exec -it my-cache-dit /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import cache_dit; print('cache-dit version:', cache_dit.__version__)"
    ```

    从ModelScope镜像下载FLUX.1-dev权重（约28 GB），在单卡上用昇腾原生注意后端生成一张测试图：
    ```bash
    export HF_ENDPOINT=https://hf-mirror.com
    export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
    python3 -c "from modelscope import snapshot_download; snapshot_download('AI-ModelScope/FLUX.1-dev', local_dir='/root/.cache/modelscope/cache-dit-flux')"
    python3 -m cache_dit.generate flux \
      --model-path /root/.cache/modelscope/cache-dit-flux \
      --attn _native_npu \
      --cpu-offload \
      --prompt "A cat holding a sign that says hello world" \
      --num_inference_steps 10 \
      --height 512 \
      --width 512 \
      --save-path output/test.png
    ```

    进程退出码为0且`output/test.png`被创建即通过。追加`--cache`可在NPU注意后端之上启用特征缓存，多卡可执行`torchrun --nproc_per_node=4 -m cache_dit.generate flux --parallel ulysses --attn _native_npu ...`。

    国内网络可通过ModelScope或hf-mirror加速模型下载：
    ```bash
    export HF_ENDPOINT=https://hf-mirror.com
    ```

