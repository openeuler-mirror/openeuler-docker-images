name: tensordict
category: ai
description: TensorDict是PyTorch生态的张量字典库，提供可像张量一样操作的字典容器、参数序列化与内存映射存储，广泛用于强化学习与函数式编程。本镜像基于torch_npu，TensorDict的全部核心操作均可在昇腾NPU上运行。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  TensorDict镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.15.5-torch_npu2.11.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/tensordict/0.15.5-torch_npu2.11.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| TensorDict 0.15.5 (torch_npu 2.11.0.post2, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/tensordict:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-tensordict \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/tensordict:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-tensordict` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/tensordict:{Tag}` | 指定要运行的镜像`openeuler/tensordict`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认TensorDict版本：
    ```bash
    docker exec -it my-tensordict /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import tensordict; print('tensordict', tensordict.__version__)"
    ```

    在`npu:0`上直接构造TensorDict并验证字典与类张量语义：
    ```bash
    python3 -c "
    import torch, torch_npu
    from tensordict import TensorDict
    td = TensorDict(source={'obs': torch.zeros(3, 4), 'action': torch.zeros(3, 2)}, batch_size=[3], device='npu:0')
    print('type', type(td).__name__)
    print('device', td.device)
    print('keys', sorted(td.keys()))
    td.set('reward', torch.ones(3, device='npu:0'))
    print('reward sum', td['reward'].sum().item())
    print('td + 1 obs sum', (td + 1)['obs'].sum().item())
    "
    ```

    嵌套TensorDict、`TensorDictParams`、`make_tensordict`、`@tensorclass`与memmap落盘等能力在NPU设备上的用法相同。

license: MIT license
similar_packages:
  - TorchData: TorchData是PyTorch官方的数据处理与加载库，其早期版本曾包含TensorDict。
  - dm-tree: dm-tree是DeepMind开源的树结构操作库，常用于嵌套数据结构的处理。
dependency:
  - python3
  - torch
  - torch_npu
  - numpy
  - cloudpickle

homepage: https://github.com/pytorch/tensordict
upstream:
  backend: GitHub
  version_url: pytorch/tensordict
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
