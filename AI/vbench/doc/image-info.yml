name: vbench
category: ai
description: VBench是开源的视频生成模型综合评测基准，将视频生成质量拆分为多个维度并提供官方评测器与vbench evaluate命令行工具。本镜像基于torch_npu软件栈构建，可在昇腾NPU上运行视频评测负载。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  VBench镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.1.5-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/vbench/0.1.5-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| VBench 0.1.5 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/vbench:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-vbench \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/vbench:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-vbench` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/vbench:{Tag}` | 指定要运行的镜像`openeuler/vbench`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认VBench安装可用：
    ```bash
    docker exec -it my-vbench /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import decord, vbench; from importlib.metadata import version; print('vbench', version('vbench')); print('Decord', decord.__version__)"
    vbench evaluate --help
    ```

    在NPU上运行human_action维度评测需要先按[昇腾Quick Start看护文档](https://github.com/cosdt-ci-test/workflows/blob/main/projects/vbench/docs/Quick-start-Ascend.md)对VBench源码应用昇腾设备补丁，再加载官方UMT权重并以`--device npu:0`评测官方LaVie示例视频：
    ```bash
    vbench evaluate \
        --videos_path <LaVie视频目录> \
        --dimension human_action \
        --device npu:0 \
        --full_json_dir <VBench_full_info.json路径> \
        --output_path ./output/vbench
    ```

license: Apache-2.0 license
similar_packages:
  - EvalCrafter: 开源的视频生成模型评测框架，从视觉质量、时间一致性等维度评估生成视频。
  - VBench-2.0: VBench团队推出的新一代视频生成评测基准，扩展了对物理规律与可控性的评测维度。
dependency:
  - python3
  - torch
  - torch_npu
  - torchvision
  - timm
  - decord
  - transformers

homepage: https://github.com/Vchitect/VBench
upstream:
  backend: GitHub
  version_url: Vchitect/VBench
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
