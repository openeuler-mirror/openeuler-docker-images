name: lightx2v
category: ai
description: LightX2V是轻量级图像/视频生成推理框架，原生支持Wan等DiT模型，提供高性能推理内核、量化与开箱即用的平台配置。本镜像基于torch_npu并预置ascend_npu平台配置，可在昇腾NPU上运行Wan2.1文生视频等生成任务。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  LightX2V镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.6.0-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/lightx2v/0.6.0-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| LightX2V 0.6.0 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/lightx2v:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-lightx2v \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/lightx2v:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-lightx2v` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/lightx2v:{Tag}` | 指定要运行的镜像`openeuler/lightx2v`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认LightX2V已安装（镜像已通过`PLATFORM=ascend_npu`预选昇腾后端）：
    ```bash
    docker exec -it my-lightx2v /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "from importlib.metadata import version; print('lightx2v', version('lightx2v'))"
    ```

    用Wan2.1-T2V-1.3B模型跑文生视频（模型约17.6 GB，从ModelScope自动下载）。运行以下Python脚本：
    ```python
    import os
    import time

    # LightX2V通过PLATFORM环境变量选择后端，必须在导入lightx2v之前设置（镜像已设置）。
    os.environ["PLATFORM"] = "ascend_npu"

    from modelscope import snapshot_download

    from lightx2v import LightX2VPipeline

    model_path = None
    for attempt in range(3):
        try:
            model_path = snapshot_download('Wan-AI/Wan2.1-T2V-1.3B')
            break
        except Exception as exc:
            print('download attempt %d/3 failed: %s' % (attempt + 1, exc))
            time.sleep(10)
    assert model_path, 'Wan2.1-T2V-1.3B download failed after 3 attempts'

    pipe = LightX2VPipeline(
        model_path=model_path,
        model_cls='wan2.1',
        task='t2v',
    )
    pipe.create_generator(config_json='/opt/LightX2V/configs/platforms/ascend_npu/wan_t2v.json')

    prompt = "Two anthropomorphic cats in comfy boxing gear and bright gloves fight intensely on a spotlighted stage."
    negative_prompt = "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"
    save_result_path = "save_results/output_lightx2v_wan_t2v.mp4"

    pipe.generate(
        seed=42,
        prompt=prompt,
        negative_prompt=negative_prompt,
        save_result_path=save_result_path,
    )
    print(f'saved: {save_result_path}')
    ```

    生成的MP4文件保存在`save_results/output_lightx2v_wan_t2v.mp4`。

    国内网络可通过ModelScope或hf-mirror加速模型下载：
    ```bash
    export HF_ENDPOINT=https://hf-mirror.com
    ```

