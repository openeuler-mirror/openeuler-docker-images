name: llama.cpp
category: ai
description: llama.cpp是面向GGUF格式大模型的轻量级C/C++推理引擎。本镜像开启GGML CANN后端构建，可将推理计算卸载到昇腾NPU，日志中设备显示为CANN0、CANN1等。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  llama.cpp镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/llama.cpp/0.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| llama.cpp 0.9.0 (CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/llama.cpp:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-llama.cpp \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/llama.cpp:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-llama.cpp` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/llama.cpp:{Tag}` | 指定要运行的镜像`openeuler/llama.cpp`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后，先下载一份GGUF模型（CANN后端在910B上支持FP16、BF16、Q8_0、Q4_0量化格式，请勿使用Q4_K_M等未列出的格式），再做一次单卡推理：
    ```bash
    docker exec -it my-llama.cpp /bin/bash
    curl -L -o qwen2.5-0.5b-instruct-q4_0.gguf \
      https://modelscope.cn/models/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/master/qwen2.5-0.5b-instruct-q4_0.gguf
    head -c 4 qwen2.5-0.5b-instruct-q4_0.gguf
    ASCEND_RT_VISIBLE_DEVICES=0 llama-completion \
        -m qwen2.5-0.5b-instruct-q4_0.gguf \
        -p "Building a website can be done in 10 simple steps:" \
        -n 64 -no-cnv -ngl 99 -sm none -mg 0 -v
    ```

    进程退出码为0、输出中出现与prompt相关的续写文本，且日志中出现`load_tensors: ... CANN0 model buffer size = ...`（模型权重已加载到NPU的关键证据），说明昇腾推理成功。若缺少`CANN0`，进程仍可能返回0，但往往在CPU上静默回退。

license: MIT license
similar_packages:
  - ollama: Ollama是开源的本地大模型运行框架，内置llama.cpp推理引擎，提供模型导入、管理与OpenAI兼容的服务接口。
  - whisper.cpp: whisper.cpp是同团队的C/C++语音识别推理引擎，与llama.cpp共享ggml计算库。
dependency:
  - CANN toolkit
  - gcc
  - cmake
  - make
  - git

homepage: https://github.com/ggml-org/llama.cpp
upstream:
  backend: GitHub
  version_url: ggml-org/llama.cpp
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
