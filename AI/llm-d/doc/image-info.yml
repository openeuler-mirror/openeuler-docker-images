similar_packages:
  - AIBrix: AIBrix是vLLM项目开源的云原生推理基础设施平台，提供推理网关、路由与弹性伸缩能力。
  - KServe: KServe是云原生的模型推理与服务编排框架，支持自动扩缩容与多种推理运行时。
dependency:
  - python3
  - torch
  - torch_npu
  - vllm
  - vllm-ascend
  - triton-ascend
  - modelscope

homepage: https://github.com/llm-d/llm-d
upstream:
  backend: GitHub
  version_url: llm-d/llm-d
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
