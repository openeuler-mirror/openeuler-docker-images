name: axolotl
category: ai
description: Axolotl是开源的大语言模型微调框架，通过YAML配置和单一CLI支持LoRA/QLoRA、全参微调及多种对齐算法。本镜像基于torch_npu，可在昇腾NPU上直接完成监督微调与RLHF训练。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  Axolotl镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.21.1-torch_npu2.11.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/axolotl/0.21.1-torch_npu2.11.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| Axolotl 0.21.1 (torch_npu 2.11.0.post2, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/axolotl:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-axolotl \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/axolotl:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-axolotl` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/axolotl:{Tag}` | 指定要运行的镜像`openeuler/axolotl`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认Axolotl版本：
    ```bash
    docker exec -it my-axolotl /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import axolotl; print('axolotl', axolotl.__version__)"
    ```

    运行`Qwen/Qwen2.5-0.5B-Instruct`的3步LoRA微调（经ModelScope下载，无需Hugging Face token）：
    ```bash
    mkdir -p /root/axolotl-qs
    ln -s "$(python3 -c 'from modelscope import snapshot_download; print(snapshot_download("Qwen/Qwen2.5-0.5B-Instruct"))' | grep '^/' | tail -n 1)" /root/axolotl-qs/model
    ```

    将4行alpaca格式数据保存为`/root/axolotl-qs/tiny_alpaca.jsonl`，并按README中的`lora-npu.yml`（关键项：`attn_implementation: eager`、`optimizer: adamw_torch`、`flash_attention: false`、四个`lora_*_kernel: false`）保存配置后执行：
    ```bash
    axolotl train /root/axolotl-qs/lora-npu.yml --launcher python
    ```

    训练日志中`"device": "npu:0"`和`Training completed!`表示训练在NPU上成功完成。

license: Apache-2.0 license
similar_packages:
  - LLaMA-Factory: LLaMA-Factory是开源的低代码大模型微调框架，支持数百种模型与多种微调算法。
  - unsloth: unsloth是面向单卡微调优化的开源训练框架，以更低的显存占用加速LoRA/QLoRA训练。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - accelerate
  - peft
  - trl
  - datasets

homepage: https://github.com/axolotl-ai-cloud/axolotl
upstream:
  backend: GitHub
  version_url: axolotl-ai-cloud/axolotl
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
