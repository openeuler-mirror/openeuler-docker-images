name: slime
category: ai
description: slime是THUDM开源的大模型RL训练框架，支持同步/异步agentic RL与RLHF训练。本镜像安装昇腾适配fork（Ascend/slime-ascend）并基于torch_npu，可在昇腾NPU上运行后训练。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  slime镜像的Tag由其版本信息和软件栈版本信息组成（上游无昇腾支持，实际安装Ascend适配fork），详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.4.0-torch_npu2.10.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/slime/0.4.0-torch_npu2.10.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| slime 0.4.0（Ascend适配fork c69676f，torch_npu 2.10.0.post6，CANN 9.1.0）on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/slime:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-slime \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/slime:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-slime` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/slime:{Tag}` | 指定要运行的镜像`openeuler/slime`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认slime已从昇腾适配fork安装：
    ```bash
    docker exec -it my-slime /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import slime; print('slime:', slime.__file__)"
    ```

    运行fork自带的最小异步RL配方（与CI一致，四卡、ModelScope的`Qwen/Qwen2.5-0.5B-Instruct`、两个rollout）：
    ```bash
    cd /opt/slime-ascend
    export PYTHONPATH=/opt/slime-ascend:$PYTHONPATH
    bash examples/fully_async/run-qwen2.5-0.5B-fully_async.sh
    ```

    推理引擎（SGLang）与训练后端（Megatron）不在本镜像内，请按fork的`scripts/ascend_script/quick_install.sh`与昇腾快速开始文档安装配套栈。

license: Apache-2.0 license
similar_packages:
  - verl: verl是字节跳动开源的分布式RLHF训练框架，基于Ray与Megatron实现大规模后训练。
  - OpenRLHF: OpenRLHF是基于DeepSpeed的易用、可扩展、高性能RLHF框架。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - ray
  - datasets

homepage: https://github.com/THUDM/slime
upstream:
  backend: GitHub
  version_url: THUDM/slime
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
