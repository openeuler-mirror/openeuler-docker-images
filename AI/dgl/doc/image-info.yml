similar_packages:
  - PyG: PyTorch Geometric是基于PyTorch的图神经网络框架，提供图深度学习所需的层、算子与数据集抽象。
  - Spektral: Spektral是基于Keras/TensorFlow的图神经网络库，面向图信号的深度学习建模。
