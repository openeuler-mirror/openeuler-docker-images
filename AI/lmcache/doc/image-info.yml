name: lmcache
category: ai
description: LMCache是面向LLM推理服务的高性能KV Cache引擎，支持前缀缓存复用与跨实例共享，可显著降低首token延迟，能与vLLM、SGLang等推理框架集成。本镜像基于torch_npu在昇腾NPU上从源码构建，可配合LMCache-Ascend插件加速推理。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  LMCache镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[0.5.6-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/lmcache/0.5.6-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| LMCache 0.5.6 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/lmcache:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-lmcache \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/lmcache:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-lmcache` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/lmcache:{Tag}` | 指定要运行的镜像`openeuler/lmcache`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认LMCache版本：
    ```bash
    docker exec -it my-lmcache /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import lmcache; print('lmcache', lmcache.__version__)"
    ```

    启动LMCache server（配合LMCache-Ascend插件与vLLM-Ascend使用时的方式）：
    ```bash
    lmcache server \
        --chunk-size 128 \
        --l1-size-gb 50 \
        --eviction-policy LRU
    ```

    等待输出`LMCache INFO: LMCache zmq cache server is running on localhost:5555`后，按[LMCache-Ascend Getting Started](https://github.com/LMCache/LMCache-Ascend#getting-started)以`LMCacheMPConnector`连接器启动vLLM-Ascend。按兼容性矩阵，本镜像（LMCache 0.5.6）需搭配LMCache-Ascend v0.5.6。

license: Apache-2.0 license
similar_packages:
  - vLLM Prefix Caching: vLLM内置的自动前缀缓存机制，可复用相同前缀的KV Cache。
  - SGLang RadixAttention: SGLang的基数树KV Cache管理机制，用于高效的前缀共享。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - grpcio
  - redis

homepage: https://github.com/LMCache/LMCache
upstream:
  backend: GitHub
  version_url: LMCache/LMCache
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
