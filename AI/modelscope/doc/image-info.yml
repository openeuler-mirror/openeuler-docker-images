name: modelscope
category: ai
description: ModelScope是阿里达摩院开源的模型即服务框架，提供模型与数据集下载、from_pretrained加载及覆盖多模态任务的pipeline API。本镜像基于torch_npu，下载的模型可通过.to('npu:0')直接放到昇腾NPU上推理。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  ModelScope镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[1.40.2-torch_npu2.9.0-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/modelscope/1.40.2-torch_npu2.9.0-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| ModelScope 1.40.2 (torch_npu 2.9.0.post8, CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/modelscope:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-modelscope \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/modelscope:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-modelscope` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/modelscope:{Tag}` | 指定要运行的镜像`openeuler/modelscope`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后先验证NPU环境，再确认modelscope安装可用：
    ```bash
    docker exec -it my-modelscope /bin/bash
    python3 -c "import torch, torch_npu; print('is_available:', torch.npu.is_available())"
    python3 -c "import modelscope, transformers; print('modelscope', modelscope.__version__); print('transformers', transformers.__version__)"
    ```

    下载Qwen2.5-0.5B-Instruct并在NPU上做一次文本生成（无需Hugging Face token）：
    ```bash
    modelscope download --model Qwen/Qwen2.5-0.5B-Instruct
    ```

    ```python
    import torch
    import torch_npu
    from modelscope import AutoModelForCausalLM, AutoTokenizer

    model_id = 'Qwen/Qwen2.5-0.5B-Instruct'
    model = AutoModelForCausalLM.from_pretrained(model_id, trust_remote_code=True).to('npu:0')
    tokenizer = AutoTokenizer.from_pretrained(model_id, trust_remote_code=True)
    print('model device:', next(model.parameters()).device)

    messages = [
        {'role': 'system', 'content': 'You are a helpful assistant.'},
        {'role': 'user', 'content': '用一句话介绍 ModelScope。'},
    ]
    text = tokenizer.apply_chat_template(messages, tokenize=False, add_generation_prompt=True)
    model_inputs = tokenizer([text], return_tensors='pt').to('npu:0')
    generated_ids = model.generate(**model_inputs, max_new_tokens=64)
    generated_ids = [out[len(inp):] for inp, out in zip(model_inputs.input_ids, generated_ids)]
    print('generated:', tokenizer.batch_decode(generated_ids, skip_special_tokens=True)[0])
    ```

