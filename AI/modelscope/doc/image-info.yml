similar_packages:
  - Hugging Face Transformers: Hugging Face开源的机器学习框架，提供数千个预训练模型，覆盖文本、视觉与多模态任务。
  - huggingface_hub: Hugging Face官方的模型与数据集下载客户端，提供CLI与Python API。
dependency:
  - python3
  - torch
  - torch_npu
  - transformers
  - datasets
  - modelscope-hub

homepage: https://github.com/modelscope/modelscope
upstream:
  backend: GitHub
  version_url: modelscope/modelscope
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
