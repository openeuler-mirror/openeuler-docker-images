similar_packages:
  - ComfyUI: 开源的节点式扩散模型图形界面，通过可视化工作流编排图像与视频生成流水线。
  - InvokeAI: 开源的Stable Diffusion创意套件，提供画布式交互界面与专业工作流。
dependency:
  - python3
  - torch
  - torch_npu
  - torchvision
  - gradio
  - transformers
  - openai CLIP
  - modelscope

