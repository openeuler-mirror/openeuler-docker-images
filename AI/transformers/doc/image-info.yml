similar_packages:
  - TensorFlow: TensorFlow是谷歌开源的端到端机器学习平台，广泛应用于各类机器学习算法的编程实现。
  - MindSpore: 昇思MindSpore是华为开源的全场景AI框架，旨在实现易开发、高效执行、全场景统一部署三大目标。
dependency:
  - python3
  - torch
  - torch_npu
  - accelerate
  - tokenizers
  - safetensors
  - huggingface-hub

homepage: https://github.com/huggingface/transformers
upstream:
  backend: GitHub
  version_url: huggingface/transformers
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
