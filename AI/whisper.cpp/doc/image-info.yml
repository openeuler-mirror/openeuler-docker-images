name: whisper.cpp
category: ai
description: whisper.cpp是OpenAI Whisper语音识别模型的纯C/C++推理实现。本镜像开启GGML CANN后端构建，可将转写计算卸载到昇腾NPU，日志中设备显示为CANN0、CANN1等。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  whisper.cpp镜像的Tag由其版本信息和软件栈版本信息组成，详细内容如下：

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[1.9.5-cann9.1.0-python3.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/AI/whisper.cpp/1.9.5-cann9.1.0-python3.12/24.03-lts-sp4/Dockerfile)| whisper.cpp 1.9.5 (CANN 9.1.0) on openEuler 24.03-LTS-SP4 | arm64,amd64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/whisper.cpp:{Tag}
  ```

usage: |
  - 前置条件

    示例使用Ascend NPU设备。运行前确认宿主机已安装Ascend驱动和固件：
    ```bash
    npu-smi info
    ls /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc
    ```
    将`${device}`替换为实际NPU设备（例如`/dev/davinci0`），并按文档挂载驱动目录。没有NPU时无法执行该示例。

  - 启动容器
    ```
    docker run \
        --name my-whisper.cpp \
        --device ${device} \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -it openeuler/whisper.cpp:{Tag} bash
    ```
    用户可根据自身需求选择对应版本的`{Tag}`、对应的NPU设备`{device}`以及容器启动的选项。

  - 参数说明
    | 配置项 | 描述 |
    |--|--|
    | `--name my-whisper.cpp` | 容器名称。|
    | `--device /dev/davinci1` | NPU设备，X是芯片物理ID号，例如davinci1。|
    | `--device /dev/davinci_manager` | davinci相关的管理设备。|
    | `--device /dev/devmm_svm` | 内存管理相关设备。|
    | `--device /dev/hisi_hdc` | hdc相关管理设备。|
    | `-v /usr/local/dcmi:/usr/local/dcmi` | 将宿主机dcmi的so和接口文件目录`/usr/local/dcmi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi` | 将宿主机`npu-smi`工具`/usr/local/bin/npu-smi`挂载到容器中，请根据实际情况修改。|
    | `-v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/` | 将宿主机目录`/usr/local/Ascend/driver/lib64/driver`挂载到容器中。请根据driver的驱动so所在路径修改。|
    | `-v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info` | 将宿主机版本信息文件`/usr/local/Ascend/driver/version.info`挂载到容器中，请根据实际情况修改。|
    | `-v /etc/ascend_install.info:/etc/ascend_install.info` | 将宿主机安装信息文件`/etc/ascend_install.info`挂载到容器中。|
    | `-it` | 以交互模式启动容器。|
    | `openeuler/whisper.cpp:{Tag}` | 指定要运行的镜像`openeuler/whisper.cpp`，其中`{Tag}`是需要替换的镜像标签。|

  - 容器测试

    进入容器后，先从ModelScope下载`tiny.en`小模型并用文件头magic校验（正确ggml文件前4字节为`lmgg`），再对仓内自带的JFK样例音频做一次单卡转写：
    ```bash
    docker exec -it my-whisper.cpp /bin/bash
    mkdir -p models
    curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
        -o models/ggml-tiny.en.bin \
        https://www.modelscope.cn/models/cjc1887415157/whisper.cpp/resolve/master/ggml-tiny.en.bin
    head -c 4 models/ggml-tiny.en.bin
    ASCEND_RT_VISIBLE_DEVICES=0 whisper-cli \
        -m models/ggml-tiny.en.bin \
        -f /usr/local/share/whisper.cpp/samples/jfk.wav \
        -t 4 --device 0
    ```

    进程退出码为0、输出末尾打印出JFK演讲的转写文本，且日志中出现`whisper_backend_init_gpu: using CANN0 backend`（模型已在NPU上初始化的关键证据），说明昇腾转写成功。若缺少`CANN0`，进程仍可能返回0，但往往在CPU上静默回退。

license: MIT license
similar_packages:
  - faster-whisper: faster-whisper是基于CTranslate2重写的Whisper高速推理实现，提供Python接口。
  - funasr: FunASR是阿里达摩院开源的语音识别工具包，支持中文语音识别与标点恢复。
dependency:
  - CANN toolkit
  - gcc
  - cmake
  - make
  - git

homepage: https://github.com/ggml-org/whisper.cpp
upstream:
  backend: GitHub
  version_url: ggml-org/whisper.cpp
  version_prefix: v
  version_filter: alpha;rc;candidate
  version_scheme: RPM
