name: vue
category: others
description: Vue（发音为 /vjuː/，类似 view）是一个用于构建用户界面的渐进式框架。它被设计为可以自底向上逐层应用，并且根据不同的使用场景，可以轻松地在库和框架之间扩展。它由一个只关注视图层的核心库和一系列支持库组成的生态系统构成，帮助你应对大型单页应用的复杂性。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  vue镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[2.7.16-oe2403sp4](https://gitcode.com/openeuler/openeuler-docker-images/blob/master/Others/vue/2.7.16/24.03-lts-sp4/Dockerfile) | Vue 2.7.16 on openEuler 24.03-LTS-SP4 | amd64, arm64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/vue:{Tag}
  ```

usage: |
  - 以交互式Shell运行容器:

    通过交互式 Shell 启动容器，使用 Vue：
    ```
    docker run -it --rm openeuler/vue:{Tag} bash
    ```

  - 示例：声明式渲染

    以下示例取自 Vue 2 官方指南。Vue 以声明式方式将消息渲染到 DOM。

    index.html
    ```html
    <div id="app">
      {{ message }}
    </div>
    ```

    app.js
    ```js
    var app = new Vue({
      el: '#app',
      data: {
        message: 'Hello Vue!'
      }
    })
    ```

    在浏览器中打开页面，它就会渲染。

  - 查看容器日志

    ```
    docker logs <container>
    ```

  - 进入运行中的容器

    ```
    docker exec -it <container> bash
    ```

license: MIT license
similar_packages:
  - React: React 是由 Facebook 开发的用于构建用户界面的 JavaScript 库。
dependency:
  - vue-router
  - vuex

homepage: https://github.com/vuejs/vue
upstream:
  backend: GitHub
  version_url: vuejs/vue
  version_prefix: v
  version_filter: alpha;beta;rc
  version_scheme: RPM
