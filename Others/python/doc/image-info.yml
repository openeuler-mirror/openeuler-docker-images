name: python
category: others
description: Python 是一种广泛使用的高级编程语言，以简洁易读的语法著称，支持多种编程范式，广泛用于 Web 开发、数据分析、人工智能等领域。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
