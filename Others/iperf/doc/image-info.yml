name: iperf
category: others
description: iperf 是一款网络性能测试工具，用于测量 带宽（Throughput） 和 延迟（Latency）。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  iperf镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[3.19-oe2403sp1](https://gitee.com/openeuler/openeuler-docker-images/blob/master/Others/iperf/3.19/24.03-lts-sp1/Dockerfile)| iperf 3.19 on openEuler 24.03-LTS-SP1 | amd64, arm64 |
  |[3.19.1-oe2403sp1](https://gitee.com/openeuler/openeuler-docker-images/blob/master/Others/iperf/3.19.1/24.03-lts-sp1/Dockerfile)| iperf 3.19.1 on openEuler 24.03-LTS-SP1 | amd64, arm64 |
  |[3.19.1-oe2403sp4](https://gitee.com/openeuler/openeuler-docker-images/blob/master/Others/iperf/3.19.1/24.03-lts-sp4/Dockerfile)| iperf 3.19.1 on openEuler 24.03-LTS-SP4 | amd64, arm64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/iperf:{Tag}
  ```

usage: |
  - 启动容器
  ```
  docker run -d --name my-iperf -p 5201:5201 openeuler/iperf:{Tag} iperf3 -s
  ```
  镜像默认命令为 `iperf3 --help`，不会常驻；上述命令以服务端模式启动并监听 5201 端口。用户可根据自身需求选择对应版本的{Tag}、容器启动的选项（如自定义端口 `-p 9000:5201`）。

  - 容器测试

  查看运行日志
  ```
  docker logs -f my-iperf
  ```

  使用shell交互
  ```
  docker exec -it my-iperf /bin/bash
  ```

  启动iperf3 (默认端口: 5201)
  ```
  iperf3 -s
  ```

  输出示例:
  ```
  Server is listening on 5201
  ```

  自定义端口运行
  ```
  iperf3 -s -p 9000
  ```

license: BSD 3-Clause License
similar_packages:
  - netperf: Netperf 是一款经典的 网络性能基准测试工具，由 Hewlett-Packard (HP) 开发，用于精确测量 TCP/UDP 的吞吐量、延迟和请求/响应性能。
dependency:
  - OpenSSL
  - libc

homepage: https://github.com/esnet/iperf
upstream:
  version_url: esnet/iperf
  version_filter: beta;mt
  backend: GitHub
  version_scheme: RPM