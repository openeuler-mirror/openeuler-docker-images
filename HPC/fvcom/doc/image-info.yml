name: fvcom
category: hpc
description: FVCOM（Finite Volume Community Ocean Model，有限体积近岸海洋模型）是由美国马萨诸塞大学达特茅斯分校陈长胜博士团队与伍兹霍尔海洋研究所联合开发的三维原始方程海洋数值模式，采用非结构化三角形网格与有限体积方法离散，具备边界拟合好、局部加密便捷、计算效率高等优点，尤其适用于岸线与海底地形复杂的河口、近岸和陆架海域。FVCOM 支持干湿网格处理、球面/笛卡尔坐标、MPI 并行、NetCDF 输入输出，并集成了海冰、泥沙、波浪（SWAVE）、水质、生态以及数据同化等多种物理过程模块，广泛应用于潮汐、风暴潮、环流及生态系统的模拟与研究。
environment: |
  本应用在Docker环境中运行,安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  fvcom镜像的Tag由其版本信息和基础镜像版本信息组成,详细内容如下
  |    Tag   |  Currently  |  Architectures  |
  |----------|-------------|------------------|
  |[4.4.12-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/HPC/fvcom/4.4.12/24.03-lts-sp4/Dockerfile) | FVCOM 4.4.12 on openEuler 24.03-LTS-SP4 | amd64, arm64 |
download: |
  拉取镜像到本地
  ```
  docker pull openeuler/fvcom:{Tag}
  ```
usage: |
  - 确保已安装 Docker 环境。
  - 从 DockerHub 获取 fvcom 镜像:
    ```
    docker pull openeuler/fvcom:{Tag}
    ```
  - 启动容器进入 FVCOM 环境
    ```
    docker run -it openeuler/fvcom:{Tag}
    ```
  - 在容器内验证安装
    ```
    which fvcom
    ```
license: MIT
similar_packages:
  - ROMS: 结构化网格区域海洋模式，与 FVCOM 同为近岸海洋动力模拟工具
  - NEMO: 欧洲开发的海洋核心模式，支持海洋、海冰和生物地球化学耦合
  - SWAN: 第三代海浪模式，FVCOM 的 SWAVE 模块即基于 SWAN 改写
dependency:
  - Fortran compiler (gfortran)
  - NetCDF-C / NetCDF-Fortran
  - OpenMPI
  - METIS (graph partitioning)
  - Julian calendar library
homepage: http://fvcom.smast.umassd.edu/
upstream:
  backend: GitHub
  version_url: FVCOM-GitHub/FVCOM
  version_prefix: release-v
  version_filter: 
  version_scheme: RPM