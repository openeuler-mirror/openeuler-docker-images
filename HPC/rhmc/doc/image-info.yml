name: rhmc
category: hpc
description: SIMULATeQCD是一个基于NVIDIA CUDA（部分支持AMD HIP）的多GPU格点量子色动力学(QCD)计算框架，用于在离散时空格点上模拟夸克和胶子的相互作用，rhmc为其有理化混合蒙特卡罗(RHMC)目标程序。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  rhmc镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[1.2.0-oe2403sp4](https://gitee.com/openeuler/openeuler-docker-images/blob/master/HPC/rhmc/1.2.0/24.03-lts-sp4/Dockerfile)| RHMC 1.2.0 on openEuler 24.03-LTS-SP4 | amd64, arm64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/rhmc:{Tag}
  ```

usage: |
  - 启动rhmc实例

    ```
    docker run -it --rm --gpus all openeuler/rhmc:{Tag}
    ```
    `openeuler/rhmc`镜像用于验证上游SIMULATeQCD版本和openEuler的集成。


  - 前置条件

    示例使用 `--gpus all`，需要 NVIDIA GPU、驱动和 nvidia-container-toolkit。运行前确认：
    ```bash
    nvidia-smi
    docker info | grep -i nvidia
    ```
    没有 GPU 时无法执行该示例。

license: MIT license
similar_packages:
  - MILC: 由MILC合作组开发的格点QCD计算代码，支持HMC和RHMC算法。
  - Chroma: 由USQCD合作组开发的格点QCD软件框架，支持多种费米子方案和并行计算。
dependency:
  - CUDA Toolkit
  - OpenMPI
  - cmake
  - gcc

homepage: https://github.com/LatticeQCD/SIMULATeQCD
upstream:
  version_url: LatticeQCD/SIMULATeQCD
  backend: GitHub
  version_scheme: RPM
  version_prefix: v
  version_filter: