similar_packages:
  - N/A
dependency:
  - gcc-c++
  - openmpi
  - python3
homepage: https://su2code.github.io
upstream:
  backend: GitHub
  version_url: su2code/SU2
  version_prefix: v
  version_filter:
  version_scheme: semantic
