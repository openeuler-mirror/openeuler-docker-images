name: cufflinks
category: hpc
description: Cufflinks 用于组装转录本、估计丰度以及检测 RNA-Seq 样本中的差异表达和调控。它接受比对的 RNA-Seq 读数，并将比对结果组装成一组简洁的转录本，然后根据支持每个转录本的读数数量来估计其相对丰度。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  cufflinks镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[2.2.1-oe2403sp4](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/HPC/cufflinks/2.2.1/24.03-lts-sp4/Dockerfile) | cufflinks 2.2.1 on openEuler 24.03-lts-sp4 | amd64, arm64 |
  |[2.2.1-oe2403sp3](https://atomgit.com/openeuler/openeuler-docker-images/blob/master/HPC/cufflinks/2.2.1/24.03-lts-sp3/Dockerfile) | cufflinks 2.2.1 on openEuler 24.03-lts-sp3 | amd64, arm64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/cufflinks:{Tag}
  ```

usage: |
  本镜像提供 Cufflinks 工具套件，用于转录组组装和差异表达分析。

  - 对比对后的 RNA-Seq 数据运行 cufflinks（需准备比对后的 BAM 文件 `accepted_hits.bam`，可参考文末“快速验证”生成）：
    ```
    docker run -it --rm -v $(pwd):/data -w /data openeuler/cufflinks:{Tag} cufflinks -o output_dir accepted_hits.bam
    ```

  - 运行 cuffdiff 进行差异表达分析（需自行准备参考注释 `transcripts.gtf` 以及两个重复样本的 BAM 文件 `sample1.bam`、`sample2.bam`）：
    ```
    docker run -it --rm -v $(pwd):/data -w /data openeuler/cufflinks:{Tag} cuffdiff -o diff_output transcripts.gtf sample1.bam sample2.bam
    ```

  - 镜像中提供的其他工具：
    ```
    cuffcompare  — 将组装转录本与参考注释进行比较
    cuffmerge    — 合并组装的转录本
    cuffnorm     — 归一化表达水平
    cuffquant    — 定量表达水平
    gffread      — 转换 GFF/GTF 文件
    gtf_to_sam   — 将 GTF 转换为 SAM 格式
    ```


  - 快速验证

    下载 Cufflinks 官方测试 SAM，补齐参考序列头并转换为 BAM：
    ```bash
    curl -LO https://raw.githubusercontent.com/cole-trapnell-lab/cufflinks/v2.2.1/doc/html/downloads/test_data.sam
    { printf '@HD\tVN:1.0\tSO:unsorted\n@SQ\tSN:test_chromosome\tLN:1000000\n'; cat test_data.sam; } > accepted_hits.sam
    docker run --rm -v "$PWD":/data -w /data openeuler/cufflinks:{Tag} sh -c 'samtools view -bS accepted_hits.sam > accepted_hits.bam'
    ```
    运行 Cufflinks：
    ```bash
    docker run --rm -v "$PWD":/data -w /data openeuler/cufflinks:{Tag} cufflinks -o output accepted_hits.bam
    ```
    预期在 `output/` 下生成 `transcripts.gtf`、`genes.fpkm_tracking`、`isoforms.fpkm_tracking` 等文件。

