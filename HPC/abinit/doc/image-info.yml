similar_packages:
  - N/A
dependency:
  - openmpi
  - openblas
  - fftw
  - hdf5
  - netcdf
  - netcdf-fortran
  - libxc
homepage: https://www.abinit.org/
upstream:
  backend: GitHub
  version_url: abinit/abinit
  version_filter: alpha;beta;rc;candidate
  version_scheme: semver
