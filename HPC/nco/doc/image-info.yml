name: nco
category: hpc
description: NCO（netCDF Operators，netCDF 操作工具）是一组独立的命令行程序，以 netCDF、HDF 和/或 DAP 文件为输入，进行派生新数据、统计计算、打印、子区域提取、元数据操作和重网格化等操作，并将结果输出到屏幕或文件中。NCO 利用 CF（Climate & Forecast）元数据约定、UDUnits 物理维度转换、OPeNDAP 网络透明访问、HDF 存储特性以及 GSL 科学计算库的多种数学与统计算法，支持网格化与非结构化的科学数据分析。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  nco镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[5.4.0-alpha04-oe2403sp4](https://gitcode.com/openeuler/openeuler-docker-images/blob/master/HPC/nco/5.4.0-alpha04/24.03-lts-sp4/Dockerfile) | nco 5.4.0-alpha04 on openEuler 24.03-lts-sp4 | amd64, arm64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/nco:{Tag}
  ```

usage: |
  - 打印当前工作目录下 netCDF 文件 in.nc 的元数据：
    ```
    docker run --rm -v $(pwd):/data openeuler/nco:{Tag} ncks -m in.nc
    ```

  - 将变量 lat 从 in.nc 复制到 out.nc：
    ```
    docker run --rm -v $(pwd):/data openeuler/nco:{Tag} ncks -v lat -O in.nc out.nc
    ```

  - 对多个记录文件求平均：
    ```
    docker run --rm -v $(pwd):/data openeuler/nco:{Tag} ncra -O in.nc avg.nc
    ```

  - 交互式进入容器依次执行多个操作符：
    ```
    docker run -it --rm -v $(pwd):/data openeuler/nco:{Tag} /bin/bash
    ```


  - 快速验证

    使用 `ncap2` 生成测试文件 `in.nc`：
    ```bash
    docker run --rm -v "$PWD":/data openeuler/nco:{Tag} ncap2 -O -s 'defdim("lat",3);lat[$lat]={10.,20.,30.};defdim("lon",2);lon[$lon]={100.,110.};v[$lat,$lon]=lat*lon;' /data/in.nc
    ```
    查看元数据：
    ```bash
    docker run --rm -v "$PWD":/data openeuler/nco:{Tag} ncks -m /data/in.nc
    ```
    预期输出包含 `lat = 3`、`lon = 2` 以及变量 `v(lat,lon)`。

