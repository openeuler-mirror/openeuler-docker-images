similar_packages:
  - ncl: NCAR Command Language，气候和天气数据处理与可视化工具

dependency:
  - netcdf
  - hdf5
  - gsl
  - antlr-C++
  - perl

homepage: http://nco.sf.net
upstream:
  backend: GitHub
  version_url: nco/nco
  version_prefix:
  version_filter: rc;candidate;beta;pre
  version_scheme: RPM
