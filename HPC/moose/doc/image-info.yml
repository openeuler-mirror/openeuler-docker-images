name: moose
category: hpc
description: moose 镜像提供 MOOSE（Multiphysics Object Oriented Simulation Environment），一个开源、并行的有限元框架，用于求解耦合多物理场问题。镜像基于 libMesh、PETSc 与 SLEPc 构建，包含框架库与头文件（用于构建基于 MOOSE 的应用），以及 moose_test 应用、exodiff 与 hit 工具。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  moose镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  |    Tag   |  Currently  |   Architectures  |
  |----------|-------------|------------------|
  |[2025.09.05-oe2403sp4](https://gitcode.com/openeuler/openeuler-docker-images/blob/master/HPC/moose/2025.09.05/24.03-lts-sp4/Dockerfile) | moose 2025.09.05 on openEuler 24.03-LTS-SP4 | amd64, arm64 |
  |[4.1.0-oe2403sp4](https://gitcode.com/openeuler/openeuler-docker-images/blob/master/HPC/moose/4.1.0/24.03-lts-sp4/Dockerfile) | moose 4.1.0 on openEuler 24.03-LTS-SP4 | amd64, arm64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/moose:{Tag}
  ```

usage: |
  - 启动 moose 容器并运行 MOOSE 输入文件
    ```
    docker run -it --name my-moose -v $(pwd):/workspace -w /workspace openeuler/moose:{Tag} bash
    ```
  - 在容器内运行输入文件
    ```
    moose_test-opt -i diffusion.i
    ```
  - 查看容器运行日志
    ```
    docker logs -f my-moose
    ```
  - 进入交互式 shell
    ```
    docker exec -it my-moose /bin/bash
    ```

license: LGPL-2.1
similar_packages:
  - FEniCS: 开源有限元求解平台，用于求解偏微分方程
  - deal.II: 支持自适应网格的 C++ 有限元库
dependency:
  - openmpi
  - openblas
  - petsc
  - slepc
  - libtirpc
homepage: https://mooseframework.inl.gov/
upstream:
  backend: GitHub
  version_url: idaholab/moose
  version_prefix:
  version_filter:
  version_scheme: RPM
