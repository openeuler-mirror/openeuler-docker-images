name: qgis
category: hpc
description: QGIS 是一个免费、开源、跨平台的地理信息系统（GIS），用于查看、编辑、分析和发布地理空间数据，内置 GDAL/OGR、GEOS、PROJ、PostGIS、SpatiaLite、WMS/WMTS/WFS 等数据提供者。
environment: |
  本应用在Docker环境中运行，安装Docker执行如下命令
  ```
  yum install -y docker
  ```
tags: |
  qgis镜像的Tag由其版本信息和基础镜像版本信息组成，详细内容如下

  | Tags | Currently |  Architectures|
  |------|-----------|---------------|
  |[4.2.2-oe2403sp4](https://gitcode.com/openeuler/openeuler-docker-images/blob/master/HPC/qgis/4.2.2/24.03-lts-sp4/Dockerfile)| QGIS 4.2.2 on openEuler 24.03-LTS-SP4 | amd64, arm64 |

download: |
  拉取镜像到本地
  ```
  docker pull openeuler/qgis:{Tag}
  ```
usage: |
  - 拉取镜像

    ```
    docker pull openeuler/qgis:{Tag}
    ```
    用户可根据自身需求选择对应版本的{Tag}、容器启动的选项。

  - 运行容器

    ```
    docker run -it --name my-qgis openeuler/qgis:{Tag}
    ```

    **注意：** 桌面版 QGIS 需要显示设备，在没有显示设备的机器上运行时，可通过 `offscreen` 平台运行命令行工具。
    ```
    # 桌面程序
    qgis --version

    # 命令行/处理工具
    qgis_process --version
    ```
    本镜像未编译 Python 绑定（openEuler 未提供 PyQt6/SIP），因此不含 Python 插件与 Python 控制台；包含核心 C++ 应用、GDAL/GEOS/PROJ、SpatiaLite、3D 与 QtWebEngine 等功能。

license: GPL-2.0-or-later
similar_packages:
  - N/A
dependency:
  - qt6
  - gdal
  - geos
  - proj
  - libspatialite

homepage: https://github.com/qgis/QGIS
upstream:
  backend: GitHub
  version_url: qgis/QGIS
  version_prefix: final-
  version_filter: rc;alpha;beta;pre;ltr
  version_scheme: RPM
